<!DOCTYPE html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Urmează - BToons</title><style>body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.panel{border:1px solid #ddd;border-radius:10px;overflow:hidden;background:#fff}.row{padding:13px 16px;border-bottom:1px solid #e5e5e5;font-size:17px;line-height:1.35}.row:last-child{border-bottom:0}.button{display:inline-block;margin-bottom:14px;padding:10px 15px;border-radius:8px;background:#111;color:#fff;text-decoration:none;font-weight:700}</style></head><body><div class="wrap"><a class="button" href="program.html">PROGRAM COMPLET</a><div class="panel" id="list"></div></div><script src="program-data.js"></script><script>function m(t){let a=t.split(':').map(Number);return a[0]*60+a[1]}function label(x){return x[0]+' — '+x[1]+(x[2]>1?' ('+x[2]+' episoade)':'')}function render(){let d=new Date(),cur=d.getHours()*60+d.getMinutes();let base=SCHEDULE.map(x=>[x[0],x[1],x[2],m(x[0])]);let norm=cur<360?cur+1440:cur;let times=base.map(x=>x[3]<360?x[3]+1440:x[3]);let active=-1;for(let i=0;i<times.length;i++){let start=times[i],end=i<times.length-1?times[i+1]:times[0]+1440;if(norm>=start&&norm<end){active=i;break}}if(active<0){active=times.reduce((best,t,i)=>t<=norm&&t>times[best]?i:best,0)}let items=[];for(let i=1;i<=5;i++)items.push(SCHEDULE[(active+i)%SCHEDULE.length]);document.getElementById('list').innerHTML='<div class="row" style="font-weight:700">URMEAZĂ</div>'+items.map(x=>'<div class="row">'+label(x)+'</div>').join('')}render();setInterval(render,30000)</script></body></html>
