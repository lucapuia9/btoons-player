<!DOCTYPE html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Urmează - BToons</title><style>body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.panel{border:1px solid #ddd;border-radius:10px;overflow:hidden;background:#fff}.row{padding:13px 16px;border-bottom:1px solid #e5e5e5;font-size:17px;line-height:1.35}.row:last-child{border-bottom:0}.button{display:inline-block;margin-bottom:14px;padding:10px 15px;border-radius:8px;background:#111;color:#fff;text-decoration:none;font-weight:700}</style></head><body><div class="wrap"><a class="button" href="program.html">PROGRAM COMPLET</a><div class="panel" id="list"></div></div><script src="program-data.js"></script><script>function m(t){let a=t.split(':').map(Number);return a[0]*60+a[1]}function label(x){return x[0]+' — '+x[1]+(x[2]>1?' ('+x[2]+' episoade)':'')}function render(){let d=new Date(),cur=d.getHours()*60+d.getMinutes(),idx=SCHEDULE.findIndex(x=>m(x[0])>cur);if(idx<0)idx=0;let items=[];for(let i=0;i<5;i++)items.push(SCHEDULE[(idx+i)%SCHEDULE.length]);document.getElementById('list').innerHTML='<div class="row" style="font-weight:700">URMEAZĂ</div>'+items.map(x=>'<div class="row">'+label(x)+'</div>').join('')}render();setInterval(render,30000)</script></body></html>
