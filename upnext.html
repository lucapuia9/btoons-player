<!DOCTYPE html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Urmează - BToons</title><style>body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.panel{border:1px solid #ddd;border-radius:10px;overflow:hidden;background:#fff}.row{padding:13px 16px;border-bottom:1px solid #e5e5e5;font-size:17px;line-height:1.35}.row:last-child{border-bottom:0}.now{font-weight:700;background:#f2f2f2}.live-dot{display:inline-block;width:11px;height:11px;background:#e53935;border-radius:50%;margin-left:9px;vertical-align:middle;box-shadow:0 0 0 2px #fff,0 0 0 3px #e53935}.badge{display:inline-block;margin-left:10px;padding:3px 7px;border-radius:5px;background:#b8860b;color:#fff;font-size:12px;font-weight:700;letter-spacing:.2px;vertical-align:middle}</style></head><body><div class="wrap"><div class="panel" id="list"></div></div><script src="program-data.js"></script><script>function m(t){let a=t.split(':').map(Number);return a[0]*60+a[1]}function label(x){let s=x.name+(x.episodes>1?' ('+x.episodes+' episoade)':'');if(x.badge)s+=' <span class="badge">'+x.badge+'</span>';return s}function activeIndex(schedule,cur){let norm=cur<360?cur+1440:cur;for(let i=0;i<schedule.length;i++){let start=m(schedule[i].time);start=start<360?start+1440:start;let end;if(schedule[i].end){end=m(schedule[i].end);end=end<360?end+1440:end}else{let next=i<schedule.length-1?m(schedule[i+1].time):m(schedule[0].time)+1440;end=next<360?next+1440:next}if(norm>=start&&norm<end)return i}return -1}function render(){let d=new Date(),cur=d.getHours()*60+d.getMinutes(),schedule=getScheduleForDate(d),active=activeIndex(schedule,cur);if(active<0)active=0;let current=schedule[active],items=[];for(let i=1;i<=5;i++)items.push(schedule[(active+i)%schedule.length]);document.getElementById('list').innerHTML='<div class="row now">ACUM <span class="live-dot"></span> — '+label(current)+'</div><div class="row" style="font-weight:700">URMEAZĂ</div>'+items.map(x=>'<div class="row">'+x.time+' — '+label(x)+'</div>').join('')}render();setInterval(render,30000)</script></body></html>
