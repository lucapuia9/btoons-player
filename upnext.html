<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Urmează - BToons</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh;padding:20px}
.wrap{max-width:850px;margin:auto}
.panel{background:#1c1c1c;border-radius:16px;padding:20px;margin:0;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.row{padding:14px 15px;border-radius:10px;background:#292929;border:1px solid transparent;margin-top:8px;font-size:16px;line-height:1.4;color:#fff}
.row:first-child{margin-top:0}
.row.now{background:#303030;border-left:4px solid #00d26a;padding-left:12px;font-weight:700}
.row.section{background:transparent;border:0;color:#aaa;font-weight:700;padding:8px 4px 2px;margin-top:8px}
.live-dot{display:inline-block;width:10px;height:10px;background:#ff3030;border-radius:50%;margin-left:8px;vertical-align:middle;box-shadow:0 0 0 2px #303030,0 0 0 3px #ff3030;animation:livepulse 1.4s infinite}
@keyframes livepulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}
@media(max-width:700px){body{padding:10px}.panel{border-radius:14px;padding:10px}.row{font-size:15px;padding:12px 13px}.row.now{padding-left:10px}}
</style>
</head>
<body>
<div class="wrap"><div class="panel" id="list"></div></div>
<script src="program-data.js"></script>
<script>
function m(t){let a=t.split(':').map(Number);return a[0]*60+a[1]}
function label(x){return x[0]+' — '+x[1]+(x[2]>1?' ('+x[2]+' episoade)':'')}
function render(){
  let d=new Date(),cur=d.getHours()*60+d.getMinutes();
  let base=SCHEDULE.map(x=>[x[0],x[1],x[2],m(x[0])]);
  let norm=cur<360?cur+1440:cur;
  let times=base.map(x=>x[3]<360?x[3]+1440:x[3]);
  let active=-1;
  for(let i=0;i<times.length;i++){
    let start=times[i],end=i<times.length-1?times[i+1]:times[0]+1440;
    if(norm>=start&&norm<end){active=i;break}
  }
  if(active<0)active=0;
  let current=SCHEDULE[active];
  let items=[];
  for(let i=1;i<=5;i++)items.push(SCHEDULE[(active+i)%SCHEDULE.length]);
  document.getElementById('list').innerHTML=
    '<div class="row now">ACUM <span class="live-dot"></span> — '+label(current)+'</div>'+ 
    '<div class="row section">URMEAZĂ</div>'+ 
    items.map(x=>'<div class="row">'+label(x)+'</div>').join('');
}
render();
setInterval(render,30000);
</script>
</body>
</html>
