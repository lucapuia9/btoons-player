<!DOCTYPE html>
<html lang="ro">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Program BToons</title><style>
body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#111}.wrap{max-width:1000px;margin:auto;padding:24px}.day{font-size:22px;font-weight:700;margin:26px 0 8px}.item{display:flex;gap:18px;padding:13px 0;border-bottom:1px solid #ddd}.time{width:125px;color:#666;flex:none}.title{font-weight:700}.now{font-size:11px;margin-left:8px;padding:3px 6px;border-radius:5px;background:#111;color:#fff}.err{color:#b00020}@media(max-width:600px){.wrap{padding:16px}.item{gap:10px}.time{width:105px}}
</style></head><body><div class="wrap"><h1>Program BToons</h1><div id="program">Se încarcă...</div></div>
<script src="config.js"></script><script src="program-data.js"></script><script>
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function current(p){if(!p.date||!p.start_time||!p.stop_time)return false;const a=new Date(p.date+'T'+p.start_time+':00');const b=new Date(p.date+'T'+p.stop_time+':00');const n=new Date();return n>=a&&n<b;}
async function load(){const el=document.getElementById('program');try{const all=await getPrograms();const seen=new Set(),groups={};all.forEach(p=>{if(!p.title)return;const key=[p.date,p.start_time,p.stop_time,p.title].map(x=>String(x||'').trim().replace(/\s+/g,' ').toLowerCase()).join('|');if(seen.has(key))return;seen.add(key);(groups[p.date]??=[]).push(p);});const days=Object.keys(groups).sort();el.innerHTML=days.map(d=>`<section><div class="day">${esc(d)}</div>${groups[d].map(p=>`<div class="item"><div class="time">${esc(p.start_time)} — ${esc(p.stop_time)}</div><div class="title">${esc(p.title)}${current(p)?'<span class="now">ACUM</span>':''}</div></div>`).join('')}</section>`).join('')||'Nu există programe disponibile momentan.';}catch(e){el.innerHTML='<div class="err">Programul nu este disponibil momentan.</div>';}}
load();setInterval(load,30000);
</script></body></html>
