<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Program BToons</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.top h1{margin:0;font-size:28px}.btn{background:#fff;color:#111;text-decoration:none;font-weight:700;padding:10px 14px;border-radius:9px}.program{border:1px solid #303030;border-radius:12px;overflow:hidden;background:#111}.row{display:grid;grid-template-columns:105px 1fr 55px;align-items:stretch;border-bottom:1px solid #303030;min-height:74px}.row:last-child{border-bottom:0}.cell{display:flex;align-items:center;padding:15px 16px}.time{font-weight:700;font-size:18px;border-right:1px solid #303030}.title{font-size:17px}.num{justify-content:center;border-left:1px solid #303030;font-size:14px;opacity:.65}.current{background:#242424;box-shadow:inset 4px 0 0 #fff}.current .time,.current .title{font-weight:700}@media(max-width:600px){.wrap{padding:10px}.top{align-items:flex-start;gap:10px}.top h1{font-size:23px}.btn{font-size:12px;padding:9px}.row{grid-template-columns:72px 1fr 40px;min-height:68px}.cell{padding:12px 10px}.time{font-size:15px}.title{font-size:15px}}</style></head><body><div class="wrap"><div class="top"><h1>Program BToons</h1></div><div class="program" id="program"></div></div><script src="program-data.js"></script><script>function mins(s){let a=s.split(':').map(Number);return a[0]*60+a[1]}function render(){let now=new Date(),cur=now.getHours()*60+now.getMinutes(),a=[...BTOONS_SCHEDULE];document.getElementById('program').innerHTML=a.map((x,i)=>{let s=mins(x[0]),e=i+1<a.length?mins(a[i+1][0]):1440,active=s<=cur&&cur<e;return `<div class="row ${active?'current':''}"><div class="cell time">${x[0]}</div><div class="cell title">${x[1]}</div><div class="cell num">${x[2]}</div></div>`}).join('')}render();setInterval(render,30000);</script></body></html>
