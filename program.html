<!DOCTYPE html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Program BToons</title><style>body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}h1{font-size:26px;margin:0 0 18px}.panel{border:1px solid #ddd;border-radius:10px;overflow:hidden;background:#fff}.row{padding:13px 16px;border-bottom:1px solid #e5e5e5;font-size:17px;line-height:1.35}.row:last-child{border-bottom:0}.row.now{font-weight:700;background:#f2f2f2}.acum{font-weight:700;margin-left:10px}.badge{display:inline-block;margin-left:10px;padding:3px 7px;border-radius:5px;background:#b8860b;color:#fff;font-size:12px;font-weight:700;letter-spacing:.2px;vertical-align:middle}</style></head><body><div class="wrap"><h1>Program BToons</h1><div class="panel" id="list"></div></div><script src="program-data.js"></script><script>function m(t){let a=t.split(':').map(Number);return a[0]*60+a[1]}function label(x){let s=x.time+' — '+x.name+(x.episodes>1?' ('+x.episodes+' episoade)':'');if(x.badge)s+=' <span class="badge">'+x.badge+'</span>';return s}function render(){let now=new Date(),cur=now.getHours()*60+now.getMinutes(),schedule=getScheduleForDate(now),times=schedule.map(x=>m(x.time));let norm=cur<360?cur+1440:cur;let active=-1;for(let i=0;i<times.length;i++){let s=times[i]<360?times[i]+1440:times[i];let e;if(schedule[i].end){e=m(schedule[i].end);e=e<360?e+1440:e}else{e=i<times.length-1?(times[i+1]<360?times[i+1]+1440:times[i+1]):(times[0]+1440)}if(norm>=s&&norm<e){active=i;break}}document.getElementById('list').innerHTML=schedule.map((x,i)=>'<div class="row '+(i===active?'now':'')+'">'+label(x)+(i===active?' <span class="acum">ACUM</span>':'')+'</div>').join('')}render();setInterval(render,30000)</script></body></html>
