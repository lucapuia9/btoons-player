<!DOCTYPE html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Program BToons</title><style>body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}h1{font-size:26px;margin:0 0 18px}.panel{border:1px solid #ddd;border-radius:10px;overflow:hidden;background:#fff}.row{padding:13px 16px;border-bottom:1px solid #e5e5e5;font-size:17px;line-height:1.35}.row:last-child{border-bottom:0}.row.now{font-weight:700;background:#f2f2f2}</style></head><body><div class="wrap"><h1>Program BToons</h1><div class="panel" id="list"></div></div><script src="program-data.js"></script><script>function m(t){let a=t.split(':').map(Number);return a[0]*60+a[1]}function label(x){return x[0]+' — '+x[1]+(x[2]>1?' ('+x[2]+' episoade)':'')}function render(){let now=new Date(),cur=now.getHours()*60+now.getMinutes();document.getElementById('list').innerHTML=SCHEDULE.map((x,i)=>{let s=m(x[0]),e=i<SCHEDULE.length-1?m(SCHEDULE[i+1][0]):1440;let active=s<=cur&&cur<e;return '<div class="row '+(active?'now':'')+'">'+label(x)+'</div>'}).join('')}render();setInterval(render,30000)</script></body></html>
