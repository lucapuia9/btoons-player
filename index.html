<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BToons</title>

    <link
        href="https://vjs.zencdn.net/8.23.4/video-js.css"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #0b0b0f;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            color: #fff;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            padding: 24px;
            background:
                radial-gradient(circle at top, #24242c 0%, #0b0b0f 45%, #050507 100%);
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            padding: 0 4px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            color: #000;
            font-size: 19px;
            font-weight: 800;
        }

        .brand-text h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .brand-text span {
            display: block;
            margin-top: 2px;
            color: #a5a5ad;
            font-size: 13px;
        }

        .live {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            color: #ddd;
            font-size: 12px;
            font-weight: 600;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ff3b30;
            box-shadow: 0 0 10px rgba(255, 59, 48, 0.8);
        }

        .player-card {
            overflow: hidden;
            border-radius: 18px;
            background: #000;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45),
                0 0 0 1px rgba(255, 255, 255, 0.06);
        }

        .player-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        .video-js {
            width: 100% !important;
            height: 100% !important;
        }

        .vjs-fullscreen {
            aspect-ratio: auto !important;
        }

        .footer {
            margin-top: 14px;
            padding: 0 4px;
            color: #777780;
            font-size: 12px;
        }

        @media (max-width: 700px) {
            .page {
                padding: 10px;
            }

            .topbar {
                margin-bottom: 10px;
            }

            .logo {
                width: 36px;
                height: 36px;
                border-radius: 10px;
                font-size: 16px;
            }

            .brand-text h1 {
                font-size: 18px;
            }

            .brand-text span {
                font-size: 11px;
            }

            .live {
                padding: 6px 9px;
                font-size: 10px;
            }

            .player-card {
                border-radius: 12px;
            }

            .footer {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="container">

        <div class="topbar">

            <div class="brand">
                <div class="logo">B</div>

                <div class="brand-text">
                    <h1>BToons</h1>
                    <span>Live TV</span>
                </div>
            </div>

            <div class="live">
                <span class="live-dot"></span>
                LIVE
            </div>

        </div>

        <div class="player-card">

            <div class="player-wrapper">

                <video
                    id="player"
                    class="video-js vjs-big-play-centered"
                    controls
                    autoplay
                    muted
                    playsinline
                    preload="auto"
                    allowfullscreen
                >
                    <source
                        src="https://under-terminology-clinton-roll.trycloudflare.com/stream.m3u8"
                        type="application/x-mpegURL">
                </video>

            </div>

        </div>

        <div class="footer">
            BToons • Live TV
        </div>

    </div>

</div>

<script src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>

<script>
const player = videojs('player', {
    fluid: false,
    responsive: true,
    fullscreen: {
        navigationUI: 'hide'
    }
});

document.addEventListener('fullscreenchange', function () {
    if (document.fullscreenElement) {
        document.body.style.background = '#000';
    }
});

function goFullscreen() {
    const element = document.documentElement;

    if (element.requestFullscreen) {
        element.requestFullscreen();
    } else if (element.webkitRequestFullscreen) {
        element.webkitRequestFullscreen();
    }
}
</script>

</body>
</html>
