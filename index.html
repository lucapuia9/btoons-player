<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BToons</title>

    <link href="https://vjs.zencdn.net/8.23.4/video-js.css" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #000;
            width: 100%;
            height: 100%;
        }

        .video-js {
            width: 100%;
            height: 100vh;
        }

        /* Mesaj eroare */
        #stream-error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;

            color: white;
            background: rgba(0, 0, 0, 0.75);
            padding: 18px 25px;
            border-radius: 10px;

            font-family: Arial, sans-serif;
            font-size: 18px;
            text-align: center;

            display: none;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <video
        id="player"
        class="video-js vjs-big-play-centered"
        controls
        autoplay
        muted
        playsinline
        preload="auto"
    >
        <source
            src="https://under-terminology-clinton-roll.trycloudflare.com/stream.m3u8"
            type="application/x-mpegURL">
    </video>

    <div id="stream-error">
        BToons nu este disponibil momentan.<br>
        Reveniți mai târziu.
    </div>

    <script src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>

    <script>
        const player = videojs('player');
        const errorMessage = document.getElementById('stream-error');

        let streamStarted = false;

        // Streamul a început să redea
        player.on('playing', function () {
            streamStarted = true;
            errorMessage.style.display = 'none';
        });

        // Eroare Video.js / HLS
        player.on('error', function () {
            errorMessage.style.display = 'block';
        });

        // Dacă nu a pornit deloc după 10 secunde
        setTimeout(function () {
            if (!streamStarted) {
                errorMessage.style.display = 'block';
            }
        }, 10000);

        // Dacă streamul rămâne blocat, încercăm din nou
        player.on('waiting', function () {
            setTimeout(function () {
                if (player.paused() === false && player.readyState() < 3) {
                    errorMessage.style.display = 'block';
                }
            }, 10000);
        });
    </script>

</body>
</html>
